<p class="calibre_zongti">总题：话语的职事与为着神的经纶之神的分赐</p>
<h2 class="calibre_content_title" id="calibre_pb_0">第一周　“坚定持续地祷告，并尽话语的职事”</h2>
<p style="text-align: center"><img alt="第一周诗歌" width="100%" src="1_hymn.png" /></p>
<p class="calibre_text_hymns"><b>2</b><br/>主是祷告的俄梅嘎，<br/>神的最大“阿们，”<br/>在我祷告停息之时，<br/>发出同感声音。</p>
<p class="calibre_text_hymns"><b>3</b><br/>但在首尾两端之间，<br/>祂让我们接联，<br/>用那不清似吃话语，<br/>译出祂所欲言。</p>
<p class="calibre_text_hymns"><b>4</b><br/>哦主，你这首先、末后，<br/>使我所有祷告<br/>与你心愿完全结合，<br/>说出你之所要。</p>
<p class="calibre_text_hymns"><b>5</b><br/>我们不能道出之祈，<br/>全有你作其始；<br/>我们简短不清之祷，<br/>其终愿你也是！</p>
