<p class="calibre_zongti">总题：话语的职事与为着神的经纶之神的分赐</p>
<p class="calibre_content_title" id="calibre_pb_0">第六篇　约翰职事中之三一神的分赐</p><p class="calibre_text_dadian">壹　约翰著作的主题是：整个宇宙的实际、中心和内容，就是三一神要把祂自己分赐到祂的选民里面，作他们的生命和生命的供应，使他们都成为神圣的，完满地彰显祂，直到永远；这也该是我们的实际、中心和内容。<a class="calibre_hyperlinks" href="6_cv.html#d0">展开纲目</a></p>
<p class="calibre_text_dadian">贰　约翰的著作揭示，在神圣的行动里以及在我们的经历里，神圣的三一将祂自己分赐到我们里面：<a class="calibre_hyperlinks" href="6_cv.html#d1">展开纲目</a></p>
<p class="calibre_text_dadian">叁　我们需要看见，约翰所供应的基督，是要将三一神作为生命分赐到我们三部分的人里面：<a class="calibre_hyperlinks" href="6_cv.html#d2">展开纲目</a></p>
