<p class="calibre_zongti">总题：话语的职事与为着神的经纶之神的分赐</p>
<h2 class="calibre_content_title" id="calibre_pb_0">第八周　三一神作生命分赐到三部分的人里，乃是根据祂的公义，借着祂的圣别，而达到祂的荣耀</h2>
<p style="text-align: center"><img alt="第八周诗歌" width="100%" src="8_hymn.png" /></p>
<p class="calibre_text_hymns"><b>2</b><br/>祂已将我重生，<br/>在我的灵中；<br/>现今在我魂里变化我；<br/>还要改变我体，<br/>和祂体相同，<br/>使我完全与祂象符合。</p>
<p class="calibre_text_hymns"><b>3</b><br/>今在生命、性情，<br/>祂与我合一；<br/>将来我要在祂荣耀里；<br/>与祂完全合一，<br/>享受祂自己，<br/>和祂全然相像，毫无异！</p>
