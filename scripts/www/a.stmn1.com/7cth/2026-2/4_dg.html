<p class="calibre_zongti">总题：话语的职事与为着神的经纶之神的分赐</p>
<p class="calibre_content_title" id="calibre_pb_0">第四篇　神尺度的度量与属灵争战的职事</p><p class="calibre_text_dadian">壹　“我们却不要过了度量夸口，只要照度量的神所分给我们尺度的度量夸口”—林后十13：<a class="calibre_hyperlinks" href="4_cv.html#d0">展开纲目</a></p>
<p class="calibre_text_dadian">贰　当我们在基督的升天里与祂同活，作复活里的新造，就为神的国从事属灵的争战—歌四8，六4、10，弗二6，六10～12：<a class="calibre_hyperlinks" href="4_cv.html#d1">展开纲目</a></p>
<p class="calibre_text_dadian">叁　在婚娶之日，基督要迎娶那些多年与神的仇敌争战的人；也就是说，基督要迎娶那些已经胜过那恶者的得胜者—十九7～9、11～16：<a class="calibre_hyperlinks" href="4_cv.html#d2">展开纲目</a></p>
