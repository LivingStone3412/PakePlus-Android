<p class="calibre_zongti">总题：话语的职事与为着神的经纶之神的分赐</p>
<h2 class="calibre_content_title" id="calibre_pb_0">第二周　和好的职事</h2>
<p style="text-align: center"><img alt="第二周诗歌" width="100%" src="2_hymn.png" /></p>
<p class="calibre_text_hymns"><b>2</b><br/>外层幔子我已过，<br/>进入头层的圣所，<br/>神圣供应全得着，<br/>阿利路亚，赞美主！<br/>我今与神已和谐，<br/>经过祭坛全圣别，<br/>神外世界永弃绝，<br/>阿利路亚，赞美主！</p>
<p class="calibre_text_hymns"><b>3</b><br/>内层幔子我也过，<br/>进入二层至圣所，<br/>来到神的施恩座，<br/>阿利路亚，赞美主！<br/>今在神前过生活，<br/>以神作我的居所，<br/>不再有己的间隔，<br/>阿利路亚，赞美主！</p>
<p class="calibre_text_hymns"><b>4</b><br/>我今是神的祭司，<br/>经过救赎才如此，<br/>身分地位何确实，<br/>阿利路亚，赞美主！<br/>我今是在灵里面，<br/>活在神的荣耀前，<br/>夜以继昼不间断，<br/>阿利路亚，赞美主！</p>
